spring.application.name=api-service
server.port=8080

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/travel_planner}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Internal Agent Service URL & Timeouts (read timeout >= 120s for multi-agent LLM orchestration)
agent-service.url=${AGENT_SERVICE_URL:http://localhost:8000}
agent-service.connect-timeout-seconds=${AGENT_SERVICE_CONNECT_TIMEOUT_SECONDS:15}
agent-service.read-timeout-seconds=${AGENT_SERVICE_READ_TIMEOUT_SECONDS:120}
