services:
  postgres:
    image: postgres:16-alpine
    container_name: travel-planner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-travel_planner}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-travel_planner}"]
      interval: 5s
      timeout: 5s
      retries: 5

  agent-service:
    build:
      context: ./agent-service
      dockerfile: Dockerfile
    container_name: travel-planner-agent-service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-travel_planner}
      - DUFFEL_API_KEY=${DUFFEL_API_KEY:-}
      - FLIGHT_PROVIDER=${FLIGHT_PROVIDER:-duffel}
      - HOTEL_PROVIDER=${HOTEL_PROVIDER:-duffel}
      - OPENTRIPMAP_API_KEY=${OPENTRIPMAP_API_KEY:-}
      - ACTIVITY_PROVIDER=${ACTIVITY_PROVIDER:-opentripmap}
      - LLM_PROVIDER=${LLM_PROVIDER:-gemini}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-gemini-2.5-flash}
      - LLM_FALLBACK_MODEL=${LLM_FALLBACK_MODEL:-gemini-3.1-flash-lite}
      - HOTEL_BUDGET_PCT=${HOTEL_BUDGET_PCT:-35.0}
      - ACTIVITY_BUDGET_PCT=${ACTIVITY_BUDGET_PCT:-20.0}
      - JWT_SECRET=${JWT_SECRET:-MultiAgentTravelPlannerSecureSecretKeyForSigningJwtTokens1234567890}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  api-service:
    build:
      context: ./api-service
      dockerfile: Dockerfile
    container_name: travel-planner-api-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/${POSTGRES_DB:-travel_planner}
      - SPRING_DATASOURCE_USERNAME=${POSTGRES_USER:-postgres}
      - SPRING_DATASOURCE_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - AGENT_SERVICE_URL=http://agent-service:8000
      - JWT_SECRET=${JWT_SECRET:-MultiAgentTravelPlannerSecureSecretKeyForSigningJwtTokens1234567890}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/api/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      agent-service:
        condition: service_healthy

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    container_name: travel-planner-dashboard
    restart: unless-stopped
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:80 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      api-service:
        condition: service_healthy

volumes:
  postgres_data:
